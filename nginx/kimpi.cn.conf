# kimpi.cn — 云之家机器人后台反向代理
# 注意：响应窗口 ≤3s，proxy 超时压紧
# 使用方式：
#   方案A 把本文件全文贴入 宝塔面板 → 网站 → kimpi.cn → 设置 → 配置文件
#   方案B 软链或 include 进 宝塔 nginx 配置目录（/www/server/panel/vhost/nginx/）
# 证书路径请按宝塔面板实际显示路径替换（一般固定为 /www/server/panel/vhost/cert/kimpi.cn/）

server {
    listen 80;
    server_name kimpi.cn www.kimpi.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kimpi.cn www.kimpi.cn;

    # 由宝塔签发，路径请按宝塔实际路径替换（通常在 /www/server/panel/vhost/cert/kimpi.cn/）
    ssl_certificate     /www/server/panel/vhost/cert/kimpi.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/kimpi.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全 header
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /www/wwwlogs/kimpi.cn.access.log;
    error_log  /www/wwwlogs/kimpi.cn.error.log;

    # 代理网关（金蝶发票云 API）— 独立超时，不适用云之家 3s 约束
    location /api/proxy/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_buffering off;
        client_max_body_size 10m;
    }

    # 反代到 docker 内的 FastAPI（容器把 8000 暴露到 127.0.0.1:8000）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 云之家 3s 超时硬约束 — Nginx 端必须比应用端更激进
        # 三个超时值之和必须 < 3s（云之家服务端硬窗口）
        proxy_connect_timeout 2s;
        proxy_send_timeout    2s;
        proxy_read_timeout    2500ms;

        # 禁用 buffer 让 webhook 响应尽快返回
        proxy_buffering off;

        # 请求体大小（卡片消息预留余量）
        client_max_body_size 1m;
    }

    # 拒绝直接访问内部健康检查路径以外的探测器（可选）
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }
}
