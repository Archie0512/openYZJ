# ibowdex.cn — 云之家机器人后台反向代理（生产环境）
# 服务器：国内 8C8G 本地服务器
# 面板：1Panel + OpenResty
# 注意：响应窗口 ≤3s，proxy 超时压紧
#
# 使用方式：
#   方案A 在 1Panel 面板 → 网站 → 创建反向代理站点后，将自定义配置写入
#          面板 → 网站 → ibowdex.cn → 配置 → 修改主配置文件
#   方案B 将本文件软链到 OpenResty conf.d 目录（/opt/1panel/apps/openresty/openresty/conf/conf.d/）
#
# 证书路径请按 1Panel 实际显示路径替换
# （1Panel → 网站 → ibowdex.cn → HTTPS → 查看证书路径，通常在 /opt/1panel/apps/openresty/openresty/conf/ssl/ 下）

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name ibowdex.cn www.ibowdex.cn;
    return 301 https://$host$request_uri;
}

# HTTPS 主站点
server {
    listen 443 ssl http2;
    server_name ibowdex.cn www.ibowdex.cn;

    # SSL 证书 — 路径请按 1Panel 实际签发路径替换
    ssl_certificate     /opt/1panel/apps/openresty/openresty/conf/ssl/ibowdex.cn/fullchain.pem;
    ssl_certificate_key /opt/1panel/apps/openresty/openresty/conf/ssl/ibowdex.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全 header
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 日志 — 路径请按 1Panel OpenResty 实际日志目录替换
    access_log /opt/1panel/apps/openresty/openresty/log/ibowdex.cn.access.log;
    error_log  /opt/1panel/apps/openresty/openresty/log/ibowdex.cn.error.log;

    # 反代到 Docker 内的 FastAPI（容器把 8000 暴露到 127.0.0.1:8000）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 云之家 3s 超时硬约束 — OpenResty 端必须比应用端更激进
        # 三个超时值之和必须 < 3s（云之家服务端硬窗口）
        proxy_connect_timeout 2s;
        proxy_send_timeout    2s;
        proxy_read_timeout    2500ms;

        # 禁用 buffer 让 webhook 响应尽快返回
        proxy_buffering off;

        # 请求体大小（卡片消息预留余量）
        client_max_body_size 1m;
    }

    # 静默处理 favicon 请求
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }
}
