# ibowdex.cn — 云之家机器人后台反向代理（生产环境）
# 服务器：国内 8C8G 本地服务器 | 面板：1Panel + OpenResty
# 端口转发：外 8060→内 80 / 外 8443→内 443
# 证书方式：DNS API 获取 Let's Encrypt（非 HTTP 验证）
# 注意：响应窗口 ≤3s，proxy 超时压紧
#
# 使用方式：
#   1Panel → 网站 → ibowdex.cn → 配置 → 修改主配置文件
#   将本文件内容粘贴到主配置中保存即可
#
# 反代规则说明：
#   1Panel 通过 include 引入 /www/sites/ibowdex.cn/proxy/*.conf 管理反代
#   本文件已将反代规则直接写入 location /，无需额外 proxy include 文件
#   如 1Panel 面板中存在 proxy include 文件，请删除以避免冲突

# HTTP → HTTPS 强制跳转（外网访问 http://ibowdex.cn:8060 → 内网 80）
server {
    listen 80;
    server_name ibowdex.cn www.ibowdex.cn;

    # ACME 证书续期验证路径（DNS API 方式下非必须，但保留以备切换回 HTTP 验证）
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    # 跳转到 HTTPS — 必须带外网端口 8443，因为非标准端口浏览器不会自动补
    return 301 https://$host:8443$request_uri;
}

# HTTPS 主站点（外网访问 https://ibowdex.cn:8443 → 内网 443）
server {
    listen 443 ssl http2;
    server_name ibowdex.cn www.ibowdex.cn;

    index index.php index.html index.htm default.php default.htm default.html;

    # 日志
    access_log /www/sites/ibowdex.cn/log/access.log main;
    error_log  /www/sites/ibowdex.cn/log/error.log;

    # 1Panel 安全规则：屏蔽敏感文件
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    # ACME 验证目录：禁止执行脚本文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    root /www/sites/ibowdex.cn/index;

    # SSL 证书 — 1Panel DNS API 方式获取的 Let's Encrypt 证书
    ssl_certificate      /www/sites/ibowdex.cn/ssl/fullchain.pem;
    ssl_certificate_key  /www/sites/ibowdex.cn/ssl/privkey.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HTTP 请求到 HTTPS 端口时重定向 — 带 8443 外网端口
    error_page 497 https://$host:8443$request_uri;

    # 安全 header
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Strict-Transport-Security "max-age=31536000";
    proxy_set_header X-Forwarded-Proto https;

    # 反代到 Docker 内的 FastAPI（容器把 8000 暴露到 127.0.0.1:8000）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 云之家 3s 超时硬约束 — OpenResty 端必须比应用端更激进
        # 三个超时值之和必须 < 3s（云之家服务端硬窗口）
        proxy_connect_timeout 2s;
        proxy_send_timeout    2s;
        proxy_read_timeout    2500ms;

        # 禁用 buffer 让 webhook 响应尽快返回
        proxy_buffering off;

        # 请求体大小（卡片消息预留余量）
        client_max_body_size 1m;
    }

    # 静默处理 favicon 请求
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }
}
