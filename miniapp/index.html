<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <title>宝德通行证</title>

  <!-- 全局样式 -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-container">
    <!-- 顶部 Tab 栏 -->
    <div class="tab-bar" id="tabBar">
      <div class="tab-item active" data-route="/passcard">申请通行证</div>
      <div class="tab-item" data-route="/history">申请记录</div>
    </div>

    <!-- 页面容器 - 所有页面内联，通过 display 切换 -->

    <!-- ======= 通行证申请页 ======= -->
    <div id="page-passcard" class="page active">
      <!-- OCR 拍照区域 -->
      <div class="card ocr-section">
        <div class="form-label">📷 拍照识别车牌</div>
        <div class="ocr-upload-area">
          <input type="file" id="ocrFileInput" accept="image/*" capture="camera" style="display:none;" onchange="handleOCRFile(this)">
          <button class="btn btn-outline btn-sm" id="ocrBtn" onclick="document.getElementById('ocrFileInput').click()">拍照识别</button>
        </div>
        <div class="ocr-result" id="ocrResult" style="display:none;"></div>
      </div>

      <!-- 分隔线 -->
      <div class="divider"><span>或手动输入</span></div>

      <!-- 表单 -->
      <div class="card">
        <!-- 车牌号 -->
        <div class="form-group">
          <label class="form-label">车牌号 *</label>
          <div class="plate-input-row">
            <button class="province-btn" id="provBtn" onclick="toggleProvinceGrid()">沪</button>
            <input class="form-input" id="plateInput" type="text" placeholder="A12345" maxlength="7"
                   oninput="this.value=this.value.toUpperCase()">
          </div>
          <div class="province-grid" id="provinceGrid" style="display:none;"></div>
        </div>

        <!-- 事由 -->
        <div class="form-group">
          <label class="form-label">事由 *</label>
          <select class="form-select" id="serviceSelect" onchange="handleServiceChange()">
            <option value="">加载中...</option>
          </select>
          <input class="form-input" id="customService" type="text" placeholder="请输入自定义事由" style="display:none; margin-top:8px;">
        </div>

        <!-- 门店信息（只读） -->
        <div class="form-group">
          <label class="form-label">门店</label>
          <div class="store-info" id="storeInfo">
            <span class="store-loading">自动获取中...</span>
          </div>
          <input type="hidden" id="storeSid" value="">
        </div>

        <!-- 备注 -->
        <div class="form-group">
          <label class="form-label">备注</label>
          <textarea class="form-textarea" id="remarkInput" placeholder="选填备注信息" rows="2"></textarea>
        </div>

        <!-- 提交 -->
        <button class="btn btn-primary" id="submitBtn" onclick="handleSubmit()">提交申请</button>
      </div>
    </div>

    <!-- ======= 申请记录页 ======= -->
    <div id="page-history" class="page">
      <div id="historyList">
        <div class="loading">加载中...</div>
      </div>

      <div class="load-more" id="loadMoreWrap" style="display:none;">
        <button class="btn btn-outline btn-sm" id="loadMoreBtn" onclick="loadMoreHistory()">加载更多</button>
      </div>
    </div>

    <!-- ======= 通行证详情页 ======= -->
    <div id="page-detail" class="page">
      <div class="navbar">
        <span class="back-btn" onclick="history.back()">‹</span>
        <span>通行证详情</span>
      </div>

      <div class="card">
        <div class="detail-header">
          <h2 id="detailTitle">出门单</h2>
        </div>

        <!-- 二维码 -->
        <div class="qr-container" id="qrContainer" style="display:none;">
          <img id="qrImage" src="" alt="二维码">
        </div>

        <!-- 信息列表 -->
        <div class="info-list" id="infoList">
          <div class="loading">加载中...</div>
        </div>

        <div class="detail-footer">
          宝德企业集团，欢迎再次光临！
        </div>
      </div>
    </div>
  </div>

  <!-- JS 加载顺序：工具 → API → OCR → 页面逻辑 → 路由（依赖顺序） -->
  <script src="js/plate.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ocr.js"></script>

  <!-- 页面初始化脚本 -->
  <script>
  // ─── 通行证申请页逻辑 ───
  function initPasscardFormPage() {
    renderProvinceGrid();
    loadServiceReasons();
    loadUserStore();
  }

  // ─── 省份选择 ───
  function renderProvinceGrid() {
    var grid = document.getElementById('provinceGrid');
    grid.innerHTML = PROVINCES.map(function (p) {
      return '<div class="prov-item" onclick="selectProvince(\'' + p + '\')">' + p + '</div>';
    }).join('');
  }

  function toggleProvinceGrid() {
    var grid = document.getElementById('provinceGrid');
    grid.style.display = grid.style.display === 'none' ? 'grid' : 'none';
  }

  function selectProvince(p) {
    document.getElementById('provBtn').textContent = p;
    document.getElementById('provinceGrid').style.display = 'none';
    var plateInput = document.getElementById('plateInput');
    if (p === '无') {
      plateInput.setAttribute('maxlength', '7');
      plateInput.setAttribute('placeholder', '0000000');
    } else {
      plateInput.setAttribute('maxlength', '7');
      plateInput.setAttribute('placeholder', 'A12345');
    }
  }

  // ─── 事由选择 ───
  function handleServiceChange() {
    var sel = document.getElementById('serviceSelect');
    var custom = document.getElementById('customService');
    custom.style.display = sel.value === '__custom' ? 'block' : 'none';
  }

  // ─── 加载事由列表 ───
  var _defaultReasons = ['来访接待', '施工', '送货', '其他'];

  function loadServiceReasons() {
    var sel = document.getElementById('serviceSelect');
    api.getServiceReasons()
      .then(function (res) {
        var reasons = (res.data && res.data.reasons) || [];
        if (reasons.length === 0) {
          reasons = _defaultReasons;
        }
        renderReasons(sel, reasons);
      })
      .catch(function () {
        renderReasons(sel, _defaultReasons);
      });
  }

  function renderReasons(sel, reasons) {
    sel.innerHTML = '<option value="">请选择事由</option>' +
      reasons.map(function (r) {
        return '<option value="' + r + '">' + r + '</option>';
      }).join('') +
      '<option value="__custom">自定义输入...</option>';
  }

  // ─── 加载门店信息（自动判定） ───
  var _userStore = null;

  function loadUserStore() {
    var storeInfo = document.getElementById('storeInfo');
    var storeSid = document.getElementById('storeSid');
    var user = getCurrentUser();

    if (!user || !user.openid) {
      storeInfo.innerHTML = '<span class="store-error">未获取用户信息</span>';
      return;
    }

    api.getUserStore(user.openid)
      .then(function (res) {
        if (res.data) {
          _userStore = res.data;
          storeSid.value = res.data.sid || '';
          storeInfo.innerHTML = '<span class="store-name">' + (res.data.company_name || '-') + '</span>';
        } else {
          storeInfo.innerHTML = '<span class="store-error">未分配门店</span>';
        }
      })
      .catch(function () {
        storeInfo.innerHTML = '<span class="store-error">获取失败，请重试</span>';
      });
  }

  // ─── OCR 拍照上传 ───
  function handleOCRFile(input) {
    var file = input.files && input.files[0];
    if (!file) return;

    var resultEl = document.getElementById('ocrResult');
    var ocrBtn = document.getElementById('ocrBtn');
    resultEl.style.display = 'block';
    resultEl.className = 'ocr-result';
    resultEl.textContent = '正在识别，请稍候...';
    setBtnLoading(ocrBtn, true, '识别中...');

    uploadForOCR(file).then(function (plate) {
      setBtnLoading(ocrBtn, false);
      ocrBtn.textContent = '拍照识别';

      if (plate) {
        resultEl.className = 'ocr-result success';
        resultEl.textContent = '识别成功: ' + plate;
        var prov = plate.charAt(0);
        var rest = plate.slice(1);
        if (PROVINCES.indexOf(prov) > -1) {
          document.getElementById('provBtn').textContent = prov;
        }
        document.getElementById('plateInput').value = rest;
      } else {
        resultEl.textContent = '未识别到车牌，请手动输入';
      }

      input.value = '';
    });
  }

  // ─── 提交 ───
  async function handleSubmit() {
    var province = document.getElementById('provBtn').textContent;
    var plateRest = document.getElementById('plateInput').value.trim();
    var serviceEl = document.getElementById('serviceSelect');
    var service = serviceEl.value;
    var sid = document.getElementById('storeSid').value;
    var remark = document.getElementById('remarkInput').value.trim();
    var submitBtn = document.getElementById('submitBtn');
    var user = getCurrentUser();

    if (service === '__custom') {
      service = document.getElementById('customService').value.trim();
    }

    var carNo = province + plateRest;
    if (!plateRest) { showToast('请输入车牌号'); return; }
    if (!isValidPlate(carNo)) { showToast('车牌号格式不正确'); return; }
    if (!service) { showToast('请选择或输入事由'); return; }
    if (!sid) { showToast('门店信息未加载，请稍后重试'); return; }

    setBtnLoading(submitBtn, true, '提交中...');

    try {
      var res = await api.sendPasscard({
        car_no: carNo,
        service: service,
        sid: sid,
        operator_name: (user && user.name) || remark || '',
      });
      showToast('提交成功');
      var passId = (res.data && res.data.pass_data && res.data.pass_data.id) || '';
      setTimeout(function () {
        navigateTo('/passcard/detail', { id: passId, car_no: carNo, service: service });
      }, 800);
    } catch (err) {
      showToast(err.message || '提交失败');
    } finally {
      setBtnLoading(submitBtn, false);
      submitBtn.textContent = '提交申请';
    }
  }

  // ─── 申请记录页逻辑 ───
  var _historyPage = 1;
  var _historySize = 10;
  var _historyEnd = false;

  function initPasscardHistoryPage() {
    _historyPage = 1;
    _historyEnd = false;
    document.getElementById('historyList').innerHTML = '';
    fetchHistory();
  }

  function fetchHistory() {
    var listEl = document.getElementById('historyList');
    var loadMoreWrap = document.getElementById('loadMoreWrap');
    var user = getCurrentUser();
    var openid = (user && user.openid) || '';

    if (_historyPage === 1) {
      showLoading(listEl);
    }

    api.getHistory(_historyPage, _historySize, openid)
      .then(function (res) {
        var items = (res.data && res.data.items) || (res.data && res.data.records) || [];

        if (_historyPage === 1) {
          listEl.innerHTML = '';
        }

        if (items.length === 0 && _historyPage === 1) {
          listEl.innerHTML = '<div class="empty"><div class="icon">📭</div><p>暂无申请记录</p></div>';
          loadMoreWrap.style.display = 'none';
          return;
        }

        items.forEach(function (item) {
          listEl.appendChild(createHistoryItem(item));
        });

        if (items.length < _historySize) {
          _historyEnd = true;
          loadMoreWrap.style.display = 'none';
        } else {
          loadMoreWrap.style.display = 'block';
        }
      })
      .catch(function (err) {
        if (_historyPage === 1) {
          listEl.innerHTML = '<div class="empty"><div class="icon">📭</div><p>暂无申请记录</p></div>';
        } else {
          showToast('加载失败');
        }
      });
  }

  function loadMoreHistory() {
    if (_historyEnd) return;
    _historyPage++;
    var btn = document.getElementById('loadMoreBtn');
    var user = getCurrentUser();
    var openid = (user && user.openid) || '';
    setBtnLoading(btn, true, '加载中...');

    api.getHistory(_historyPage, _historySize, openid)
      .then(function (res) {
        var items = (res.data && res.data.items) || (res.data && res.data.records) || [];
        var listEl = document.getElementById('historyList');
        items.forEach(function (item) {
          listEl.appendChild(createHistoryItem(item));
        });
        if (items.length < _historySize) {
          _historyEnd = true;
          document.getElementById('loadMoreWrap').style.display = 'none';
        }
      })
      .catch(function () {
        showToast('加载失败');
        _historyPage--;
      })
      .finally(function () {
        setBtnLoading(btn, false);
        btn.textContent = '加载更多';
      });
  }

  function createHistoryItem(item) {
    var el = document.createElement('div');
    el.className = 'list-item';
    el.onclick = function () {
      var id = item._id || item.id || item.msgId || '';
      navigateTo('/passcard/detail', { id: id });
    };

    var statusText = '已发送';
    var tagClass = 'tag-success';
    if (item.status === 'expired') {
      statusText = '已过期';
      tagClass = 'tag-warning';
    } else if (item.status === 'pending') {
      statusText = '处理中';
      tagClass = 'tag-info';
    }

    el.innerHTML = '<div class="info">'
      + '<div class="title">' + (item.car_no || '-') + '</div>'
      + '<div class="desc">' + (item.service || '') + ' · ' + formatDateTime(item.created_at || item.send_time) + '</div>'
      + '</div>'
      + '<span class="status-tag ' + tagClass + '">' + statusText + '</span>';

    return el;
  }

  // ─── 通行证详情页逻辑 ───
  function initPasscardDetailPage() {
    var passId = getHashParam('id');
    var carNo = getHashParam('car_no');
    var service = getHashParam('service');

    if (carNo) {
      renderDetailInfo({
        car_no: decodeURIComponent(carNo),
        service: decodeURIComponent(service || ''),
      });
    }

    if (passId) {
      document.getElementById('detailTitle').textContent = '出门单 #' + passId.slice(-6);
      api.getPasscard(passId)
        .then(function (res) {
          if (res.data) renderDetailInfo(res.data);
        })
        .catch(function (err) {
          console.error('[Detail] 获取失败:', err);
        });
    }
  }

  function renderDetailInfo(data) {
    var infoList = document.getElementById('infoList');

    if (data.qr_url) {
      var qrContainer = document.getElementById('qrContainer');
      var qrImage = document.getElementById('qrImage');
      qrContainer.style.display = 'flex';
      qrImage.src = data.qr_url;
    }

    var rows = [
      { label: '门店', value: data.company_name || data.sid || '-' },
      { label: '车牌', value: data.car_no || '-' },
      { label: '事由', value: data.service || '-' },
      { label: '发放时间', value: formatDateTime(data.created_at || data.send_time) },
      { label: '截止时间', value: formatDateTime(data.expire_at || data.expire_time) },
      { label: '备注', value: data.operator_name || data.remark || '-' },
    ];

    infoList.innerHTML = rows.map(function (r) {
      return '<div class="info-row"><span class="label">' + r.label + '</span><span class="value">' + r.value + '</span></div>';
    }).join('');
  }
  </script>

  <!-- 路由管理 -->
  <script src="js/app.js"></script>
</body>
</html>
